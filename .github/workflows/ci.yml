name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest -v test_app

      - name: Build Docker image
        run: docker build -t cicd-lab:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name cicd-lab -p 127.0.0.1:8080:8000 cicd-lab:ci
          trap 'docker logs cicd-lab; docker rm -f cicd-lab' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/health -o response.json

          python3 -c 'import json; assert json.load(open("response.json")) == {"status": "ok"}'

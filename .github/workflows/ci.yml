name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest -v test_app

      - name: Build Docker image
        run: docker build -t cicd-lab:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name cicd-lab -p 127.0.0.1:8080:8000 cicd-lab:ci
          trap 'docker logs cicd-lab; docker rm -f cicd-lab' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 \
            --output response.json \
            http://127.0.0.1:8080/health

          python3 -c 'import json; assert json.load(open("response.json")) == {"status": "ok"}'

      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/skup04/cicd-lab:${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag cicd-lab:ci "$image"
          docker push "$image"
